<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
var iconColors=['#16a34a','#22c55e','#3b82f6','#8b5cf6','#ec4899','#f59e0b','#ef4444','#06b6d4','#10b981','#f97316','#6366f1','#84cc16','#14b8a6','#eab308','#a855f7','#f43f5e','#0ea5e9','#d946ef','#64748b','#0891b2'];
function getColor(n){var h=0;for(var i=0;i<n.length;i++){h=n.charCodeAt(i)+((h<<5)-h)}return iconColors[Math.abs(h)%iconColors.length]}
function highlight(t,term){if(!term)return esc(t);var e=esc(t),q=esc(term),re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return e.replace(re,'<mark>$1</mark>')}
function toolCardHtml(name,desc,url,opts){opts=opts||{};var cls='tool-card';if(opts.large)cls+=' large';if(opts.isNew)cls+=' new-badge';var c=getColor(name),f=name.charAt(0);return '<div class="'+cls+'" data-url="'+esc(url)+'" data-name="'+esc(name)+'" data-desc="'+esc(desc)+'"><div class="tool-icon" style="background:'+c+'">'+esc(f)+'</div><div class="tool-info"><div class="tool-name">'+esc(name)+'</div><div class="tool-desc">'+esc(desc)+'</div></div></div>'}
function sectionHtml(cat){var s='<section class="section" id="section-'+cat.id+'"><div class="section-header"><div class="section-title">'+esc(cat.title)+'</div></div>';if(cat.subCats){s+='<div class="sub-tabs" data-cat="'+cat.id+'"><span class="sub-tab active" data-sub="全部">全部</span>';for(var i=0;i<cat.subCats.length;i++){s+='<span class="sub-tab" data-sub="'+esc(cat.subCats[i])+'">'+esc(cat.subCats[i])+'</span>'}s+='</div>'}s+='<div class="tool-grid">';for(var i=0;i<cat.tools.length;i++){var t=cat.tools[i];s+=toolCardHtml(t[0],t[1],t[2])}s+='</div></section>';return s}
function featuredCardHtml(name,url){return '<a class="featured-card" href="'+esc(url)+'" target="_blank" rel="noopener" data-name="'+esc(name)+'" data-desc="">'+esc(name)+'</a>'}
function render(){
  var th='';for(var i=0;i<topRecommended.length;i++){var t=topRecommended[i];th+=toolCardHtml(t[0],t[1],t[2],{large:true})}
  document.getElementById('container-top').innerHTML=th;
  var ch='';for(var i=0;i<categories.length;i++)ch+=sectionHtml(categories[i]);
  document.getElementById('container-categories').innerHTML=ch;
  var toolsNav='<a class="cat-nav-item" href="#section-top">精选推荐</a>';
  for(var i=0;i<12;i++)toolsNav+='<a class="cat-nav-item" href="#section-'+categories[i].id+'">'+esc(categories[i].title)+'</a>';
  document.getElementById('catNavTools').innerHTML=toolsNav;
  var indNav='';
  for(var i=12;i<categories.length;i++)indNav+='<a class="cat-nav-item" href="#section-'+categories[i].id+'">'+esc(categories[i].title)+'</a>';
  document.getElementById('catNavIndustry').innerHTML=indNav;
  document.querySelectorAll('.sub-tabs').forEach(function(tabs){
    tabs.querySelectorAll('.sub-tab').forEach(function(tab){
      tab.addEventListener('click',function(){
        tabs.querySelectorAll('.sub-tab').forEach(function(t){t.classList.remove('active')});
        tab.classList.add('active');
        var subName=tab.dataset.sub||'';
        var section=tabs.closest('.section');
        var cards=section.querySelectorAll('.tool-card');
        if(subName==='全部'||subName.indexOf('常用')>=0){
          cards.forEach(function(c){c.classList.remove('hidden')});
          var st=section.querySelector('.sub-filter-status');if(st)st.remove();
          return
        }
        var keywords={
          'AI图片插画生成':['插画','绘画','生图','画','图像生成','绘图','art'],
          'AI图片背景移除':['抠图','背景','remove','bg','cutout'],
          'AI图片物体抹除':['消除','抹除','擦除','eraser','remove'],
          'AI图片无损放大':['放大','超分','upscale','enhance','高清'],
          'AI图片优化修复':['修复','修复','增强','restore','enhance','优化','后期'],
          'AI商品图生成':['商品','电商','营销','产品图'],
          'AI 3D模型生成':['3D','三维','模型','model','渲染'],
          'AI幻灯片和演示':['PPT','幻灯','演示','slide','deck','presentation'],
          'AI思维导图':['思维导图','脑图','mindmap','mind','白板','画板','流程图'],
          'AI文档工具':['文档','阅读','PDF','文献','知识库','笔记','doc'],
          'AI会议工具':['会议','meeting','纪要','转录','字幕','transcrib'],
          'AI招聘求职':['简历','面试','求职','招聘','resume','interview','job'],
          'AI法律助手':['法律','律师','law','legal','合同'],
          'AI语言翻译':['翻译','translate','translat'],
          'AI效率提升':['效率','办公','助手','productivity'],
          '插件与Skills':['skill','插件','plugin']
        };
        var kw=keywords[subName]||[subName.replace(/AI|图片|工具/g,'')];
        cards.forEach(function(c){
          var txt=((c.dataset.name||'')+(c.dataset.desc||'')).toLowerCase();
          var match=false;
          for(var i=0;i<kw.length;i++){if(txt.indexOf(kw[i].toLowerCase())>=0){match=true;break}}
          if(match)c.classList.remove('hidden');else c.classList.add('hidden')
        });
        var visible=section.querySelectorAll('.tool-card:not(.hidden)').length;
        var status=section.querySelector('.sub-filter-status');
        if(!status){status=document.createElement('div');status.className='sub-filter-status';tabs.parentNode.insertBefore(status,tabs.nextSibling)}
        status.textContent='“'+subName+'”筛选结果：'+visible+'个工具（'+(kw.join(' / '))+'）'
      })
    })
  });
  document.body.addEventListener('click',function(e){
    var card=e.target.closest('.tool-card');
    if(card&&card.dataset.url){e.preventDefault();if(card.dataset.url==='#'){openIndustry(card.dataset.name||'行业',card.dataset.desc||'')}else{window.open(card.dataset.url,'_blank','noopener')}return}
    var a=e.target.closest('a');if(!a)return;var href=a.getAttribute('href');if(!href)return;if(href.charAt(0)==='#'){e.preventDefault();var el=document.querySelector(href);if(!el)return;var offset=el.getBoundingClientRect().top+window.pageYOffset-180;window.scrollTo({top:offset,behavior:'smooth'});el.classList.add('section-flash');setTimeout(function(){el.classList.remove('section-flash')},1500);return}
  })
}
function openPreview(name,url){
  document.getElementById('previewToolName').textContent=name;
  document.getElementById('previewOpenBtn').href=url;
  document.getElementById('previewUrlBox').textContent=url;
  var iframe=document.getElementById('previewIframe');
  var fallback=document.getElementById('previewFallback');
  fallback.classList.remove('show');
  iframe.style.display='block';
  document.getElementById('previewOverlay').classList.add('active');
  document.body.style.overflow='hidden';
  iframe.onload=function(){};
  iframe.src=url
}
function closePreview(){
  document.getElementById('previewOverlay').classList.remove('active');
  document.getElementById('previewIframe').src='about:blank';
  document.body.style.overflow=''
}
function copyPreviewUrl(){
  var url=document.getElementById('previewUrlBox').textContent;
  var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');var btns=[document.getElementById('previewCopyBtn'),document.getElementById('previewCopyBtn2')];var orig=[];btns.forEach(function(b,i){if(b){orig[i]=b.textContent;b.textContent='已复制 ✓'}});setTimeout(function(){btns.forEach(function(b,i){if(b)b.textContent=orig[i]})},1500)}catch(e){}
  document.body.removeChild(ta)
}
document.getElementById('previewCloseBtn').addEventListener('click',closePreview);
document.getElementById('previewCopyBtn').addEventListener('click',copyPreviewUrl);
document.getElementById('previewCopyBtn2').addEventListener('click',copyPreviewUrl);
document.getElementById('previewShowFallback').addEventListener('click',function(){document.getElementById('previewFallback').classList.add('show');document.getElementById('previewIframe').style.display='none'});
document.getElementById('previewOverlay').addEventListener('click',function(e){if(e.target===this)closePreview()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closePreview();closeIndustry()}});

var searchInput=document.getElementById('searchInput'),searchStatus=document.getElementById('searchStatus'),searchTimer=null;
function performSearch(term){term=term.trim().toLowerCase();var cards=document.querySelectorAll('.tool-card,.tool-card'),sections=document.querySelectorAll('.section');if(!term){cards.forEach(function(c){c.classList.remove('hidden');var n=c.querySelector('.tool-name'),d=c.querySelector('.tool-desc');if(n)n.innerHTML=esc(c.dataset.name||'');if(d)d.innerHTML=esc(c.dataset.desc||'')});sections.forEach(function(s){s.classList.remove('hidden')});searchStatus.classList.remove('visible');return}var m=0;cards.forEach(function(c){var name=(c.dataset.name||'').toLowerCase(),desc=(c.dataset.desc||'').toLowerCase(),ok=name.indexOf(term)>=0||desc.indexOf(term)>=0;if(ok){c.classList.remove('hidden');m++;var n=c.querySelector('.tool-name'),d=c.querySelector('.tool-desc');if(n)n.innerHTML=highlight(c.dataset.name||'',term);if(d&&c.dataset.desc)d.innerHTML=highlight(c.dataset.desc,term)}else{c.classList.add('hidden')}});sections.forEach(function(s){var v=s.querySelectorAll('.tool-card:not(.hidden),.featured-card:not(.hidden)');if(v.length>0)s.classList.remove('hidden');else s.classList.add('hidden')});if(m===0){searchStatus.innerHTML='未找到与 "'+esc(term)+'" 相关的工具';searchStatus.classList.add('visible')}else{searchStatus.innerHTML='找到 <strong style="color:var(--primary)">'+m+'</strong> 个相关工具';searchStatus.classList.add('visible')}}
searchInput.addEventListener('input',function(){var v=this.value;clearTimeout(searchTimer);searchTimer=setTimeout(function(){performSearch(v)},150)});
searchInput.addEventListener('keydown',function(e){if(e.key==='Escape'){this.value='';performSearch('');this.blur()}});
var backToTop=document.getElementById('backToTop'),ticking=false;
window.addEventListener('scroll',function(){if(!ticking){window.requestAnimationFrame(function(){if(window.pageYOffset>window.innerHeight*0.8)backToTop.classList.add('visible');else backToTop.classList.remove('visible');ticking=false});ticking=true}});
backToTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});

/* ===== 回到首页功能 ===== */
var homeBtn=document.getElementById('homeBtn');
function closeAllOverlays(){['previewOverlay','industryOverlay'].forEach(function(id){var el=document.getElementById(id);if(el)el.classList.remove('active')});var pf=document.getElementById('previewIframe');if(pf)pf.src='about:blank';document.body.style.overflow=''}
function goHome(){var si=document.getElementById('searchInput');if(si){si.value='';performSearch('')}document.querySelectorAll('.sub-tabs').forEach(function(tabs){var all=tabs.querySelector('.sub-tab[data-sub="全部"]');if(all&&!all.classList.contains('active'))all.click()});closeAllOverlays();window.scrollTo({top:0,behavior:'smooth'})}
if(homeBtn)homeBtn.addEventListener('click',goHome);
var logoEl=document.querySelector('.logo');if(logoEl)logoEl.addEventListener('click',goHome);
